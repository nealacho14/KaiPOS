name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify OpenAPI in sync
        run: |
          pnpm --filter @kaipos/backend openapi:generate
          if ! git diff --exit-code apps/backend/openapi.json; then
            echo "::error::apps/backend/openapi.json is out of sync with the Zod schemas. Run 'pnpm --filter @kaipos/backend openapi:generate' and commit the result."
            exit 1
          fi

      - name: Test
        run: pnpm test

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for app changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            app:
              - 'apps/**'
              - 'packages/**'
              - 'infra/**'
              - 'pnpm-lock.yaml'
              - 'package.json'

  deploy:
    name: Deploy to Production
    needs: [quality, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy
        run: pnpm deploy:prod

      - name: Notify success
        if: success()
        run: echo "Deployed commit ${{ github.sha }} to production"

      - name: Notify failure
        if: failure()
        run: echo "Deploy failed for commit ${{ github.sha }}"

  e2e:
    name: E2E (Cypress)
    needs: [deploy]
    runs-on: ubuntu-latest
    # Cypress runs as a post-deploy smoke test against the freshly deployed
    # prod frontend (KaiPOS is still in MVP phase, so "prod" doubles as the
    # staging target). CYPRESS_BASE_URL and the per-role/per-tenant
    # credentials live in repo Variables (not Secrets) because they are
    # documented test accounts, not sensitive production data. The job is
    # skipped when CYPRESS_BASE_URL is not configured so a fresh fork can
    # still run quality checks.
    #
    # If the suite fails, the workflow is marked red but prod stays on the
    # just-deployed commit — rollback is manual (revert the offending commit
    # and let CI redeploy).
    if: vars.CYPRESS_BASE_URL != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Cypress binary
        # pnpm + setup-node's node_modules cache can skip Cypress's postinstall,
        # leaving the npm package without the matching binary in ~/.cache/Cypress.
        # Run the explicit installer so the binary is always present on this runner.
        run: pnpm --filter @kaipos/e2e exec cypress install

      - name: Wait for new deployment to be live
        # CloudFront invalidation + Lambda cold start can take ~30s after
        # `pnpm deploy:prod` returns. Poll /api/health so Cypress hits the
        # newly deployed code instead of a stale cache or a 502.
        run: |
          for i in {1..30}; do
            if curl -fsS "${{ vars.CYPRESS_BASE_URL }}/api/health" >/dev/null; then
              echo "Healthy"; exit 0
            fi
            sleep 5
          done
          echo "::error::Deployment did not become healthy in time"
          exit 1

      - name: Run Cypress
        run: pnpm --filter @kaipos/e2e cy:run
        env:
          # CYPRESS_* variables flow into Cypress.env(...) with the prefix
          # stripped — see apps/e2e/.env.example for the full catalogue.
          CYPRESS_BASE_URL: ${{ vars.CYPRESS_BASE_URL }}
          # GITHUB_RUN_ID is namespaced through CYPRESS_ so the SKU prefix
          # helper picks it up; this isolates products created by parallel
          # PR runs against the same staging Mongo.
          CYPRESS_GITHUB_RUN_ID: ${{ github.run_id }}
          # Pre-seed admin used by auth.cy.ts.
          CYPRESS_USER_ADMIN_EMAIL: ${{ vars.CYPRESS_USER_ADMIN_EMAIL }}
          CYPRESS_USER_ADMIN_PASSWORD: ${{ vars.CYPRESS_USER_ADMIN_PASSWORD }}
          # Per-role / per-tenant accounts from db:seed-cypress.
          CYPRESS_USER_ADMIN_A_EMAIL: ${{ vars.CYPRESS_USER_ADMIN_A_EMAIL }}
          CYPRESS_USER_ADMIN_A_PASSWORD: ${{ vars.CYPRESS_USER_ADMIN_A_PASSWORD }}
          CYPRESS_USER_MANAGER_A_EMAIL: ${{ vars.CYPRESS_USER_MANAGER_A_EMAIL }}
          CYPRESS_USER_MANAGER_A_PASSWORD: ${{ vars.CYPRESS_USER_MANAGER_A_PASSWORD }}
          CYPRESS_USER_SUPERVISOR_A_EMAIL: ${{ vars.CYPRESS_USER_SUPERVISOR_A_EMAIL }}
          CYPRESS_USER_SUPERVISOR_A_PASSWORD: ${{ vars.CYPRESS_USER_SUPERVISOR_A_PASSWORD }}
          CYPRESS_USER_CASHIER_A_EMAIL: ${{ vars.CYPRESS_USER_CASHIER_A_EMAIL }}
          CYPRESS_USER_CASHIER_A_PASSWORD: ${{ vars.CYPRESS_USER_CASHIER_A_PASSWORD }}
          CYPRESS_USER_WAITER_A_EMAIL: ${{ vars.CYPRESS_USER_WAITER_A_EMAIL }}
          CYPRESS_USER_WAITER_A_PASSWORD: ${{ vars.CYPRESS_USER_WAITER_A_PASSWORD }}
          CYPRESS_USER_KITCHEN_A_EMAIL: ${{ vars.CYPRESS_USER_KITCHEN_A_EMAIL }}
          CYPRESS_USER_KITCHEN_A_PASSWORD: ${{ vars.CYPRESS_USER_KITCHEN_A_PASSWORD }}
          CYPRESS_USER_ADMIN_B_EMAIL: ${{ vars.CYPRESS_USER_ADMIN_B_EMAIL }}
          CYPRESS_USER_ADMIN_B_PASSWORD: ${{ vars.CYPRESS_USER_ADMIN_B_PASSWORD }}
          CYPRESS_USER_MANAGER_B_EMAIL: ${{ vars.CYPRESS_USER_MANAGER_B_EMAIL }}
          CYPRESS_USER_MANAGER_B_PASSWORD: ${{ vars.CYPRESS_USER_MANAGER_B_PASSWORD }}
          CYPRESS_USER_SUPERVISOR_B_EMAIL: ${{ vars.CYPRESS_USER_SUPERVISOR_B_EMAIL }}
          CYPRESS_USER_SUPERVISOR_B_PASSWORD: ${{ vars.CYPRESS_USER_SUPERVISOR_B_PASSWORD }}
          CYPRESS_USER_CASHIER_B_EMAIL: ${{ vars.CYPRESS_USER_CASHIER_B_EMAIL }}
          CYPRESS_USER_CASHIER_B_PASSWORD: ${{ vars.CYPRESS_USER_CASHIER_B_PASSWORD }}
          CYPRESS_USER_WAITER_B_EMAIL: ${{ vars.CYPRESS_USER_WAITER_B_EMAIL }}
          CYPRESS_USER_WAITER_B_PASSWORD: ${{ vars.CYPRESS_USER_WAITER_B_PASSWORD }}
          CYPRESS_USER_KITCHEN_B_EMAIL: ${{ vars.CYPRESS_USER_KITCHEN_B_EMAIL }}
          CYPRESS_USER_KITCHEN_B_PASSWORD: ${{ vars.CYPRESS_USER_KITCHEN_B_PASSWORD }}
          CYPRESS_USER_SUPER_ADMIN_EMAIL: ${{ vars.CYPRESS_USER_SUPER_ADMIN_EMAIL }}
          CYPRESS_USER_SUPER_ADMIN_PASSWORD: ${{ vars.CYPRESS_USER_SUPER_ADMIN_PASSWORD }}

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: apps/e2e/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Cypress videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: apps/e2e/cypress/videos
          if-no-files-found: ignore
          retention-days: 7
