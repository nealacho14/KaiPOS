<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Panel de administración de KaiPOS: catálogo, usuarios y sucursales." />
    <!-- Two entries so the browser chrome matches the active scheme; a single
         static theme-color is wrong half the time in an app with a real dark mode. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0B7A75" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#043B38" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent runs the web view full-bleed when installed, which is
         what makes viewport-fit=cover and theme.safeArea.* load-bearing. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Vite rewrites these with the app's `base`, so the POS build emits /pos/. -->
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96x96.png" />
    <!-- iOS ignores the manifest icons for the home-screen shortcut. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <title>KaiPOS - Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
